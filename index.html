<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e9dfc8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>康熙南宫县城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe6d2; --paper2:#e4d8bd; --ink:#2a2420; --ink2:#5d5246; --line:#c9b994;
  --cinnabar:#a8322a; --panel:rgba(244,237,222,.94); --shadow:0 6px 24px rgba(40,28,15,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9ccb0;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
#app{position:fixed;inset:0}
canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;touch-action:manipulation}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#title,#side,#info,#bar,#walkUI,#joy,#mini{-webkit-user-select:none;user-select:none}
/* 触屏摇杆 */
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(78px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;
  background:rgba(244,237,222,.38);border:1.5px solid rgba(255,250,240,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);display:none;touch-action:none;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(42,36,32,.72);
  border:2px solid rgba(255,250,240,.85);pointer-events:none}
body.touch.walking #joy{display:block}
body.touch #dpad{display:none!important}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(42,36,32,.82);color:#f4ecdc;padding:10px 16px;border-radius:6px;
  font-size:14px;line-height:1.7;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
#toast.show{opacity:1}
/* 漫步：当前街名路牌 + 街边名牌 */
#streetSign{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);display:none;opacity:0;
  transition:opacity .35s,transform .35s;pointer-events:none;background:#1c2e48;color:#e3bf66;border:3px solid #b8913f;outline:1px solid #1c2e48;
  padding:5px 18px 6px;font-size:20px;font-weight:900;letter-spacing:.32em;text-indent:.32em;border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
#streetSign small{display:block;font-size:11px;letter-spacing:.2em;color:#c9b48a;font-weight:600;text-align:center;margin-top:1px}
body.walking #streetSign{display:block}
#streetSign.show{opacity:1;transform:translateX(-50%)}
body.walking .st{writing-mode:horizontal-tb!important;font-size:13px;letter-spacing:.18em;color:#f1e3c2;background:rgba(42,36,32,.72);
  padding:2px 8px;border-radius:2px;border:1px solid rgba(227,191,102,.6);text-shadow:none}

/* title */
#title{position:fixed;left:16px;top:14px;padding:12px 16px 10px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);border-radius:4px;max-width:300px}
#title h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.18em;display:flex;align-items:center;gap:10px}
#title h1 .seal{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--cinnabar);color:#f6eee0;
  font-size:13px;line-height:1;border-radius:3px;letter-spacing:0;writing-mode:vertical-rl}
#title p{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6}

/* side list */
#side{position:fixed;left:16px;top:150px;bottom:74px;width:236px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
#side .hd{padding:10px 12px 8px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
#cats{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{border:1px solid var(--line);background:#f7f1e4;border-radius:12px;padding:2px 9px 2px 7px;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.off{opacity:.38}
#list{overflow:auto;padding:4px 0 10px;flex:1}
#list h4{margin:10px 12px 3px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.1em}
#list .it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 12px;
  font-size:14px;cursor:pointer}
#list .it:hover,#list .it.on{background:rgba(168,50,42,.09)}
#list .it i{width:7px;height:7px;border-radius:50%;flex:none}
#list .it small{margin-left:auto;font-size:11px;color:#9a7b4f}
#list .it.hide{display:none}

/* info */
#info{position:fixed;right:16px;top:14px;width:340px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;padding:16px 18px 18px;
  transform:translateX(calc(100% + 30px));transition:transform .35s ease}
#info.show{transform:none}
#info .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink2)}
#info h2{margin:0 0 6px;font-size:26px;letter-spacing:.12em;font-weight:900}
#info .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#info .tag{font-size:12px;padding:1px 8px;border-radius:10px;color:#fff}
#info .tag.warn{background:#fff;color:#9a5b14;border:1px solid #d7a85c}
#info h5{margin:14px 0 5px;font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:600}
#info blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--cinnabar);background:rgba(168,50,42,.05);
  font-size:14.5px;line-height:1.85}
#info p{margin:0;font-size:14px;line-height:1.8}

/* toolbar */
#bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
#bar button{border:0;background:none;padding:7px 12px;border-radius:4px;cursor:pointer;font-size:14px;white-space:nowrap}
#bar button:hover{background:rgba(0,0,0,.05)}
#bar button.on{background:var(--ink);color:var(--paper)}
#hint{position:fixed;right:16px;bottom:22px;font-size:12px;color:#5d5246;background:rgba(244,237,222,.75);padding:4px 8px;border-radius:4px}

/* compass */
#compass{position:fixed;right:16px;top:14px;width:54px;height:54px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);transition:right .35s}
#compass.shift{right:372px}
#compass .n{position:absolute;inset:0;display:grid;place-items:center}
#compass svg{width:54px;height:54px}

/* labels */
.lb{pointer-events:auto;cursor:pointer;font-size:12.5px;font-weight:600;padding:2px 7px 2px 6px;border-radius:3px;
  background:rgba(250,245,233,.9);border:1px solid rgba(90,70,40,.25);white-space:nowrap;display:flex;align-items:center;gap:4px;
  transform:translateY(-8px);transition:transform .15s,background .15s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lb i{width:7px;height:7px;border-radius:50%}
.lb.q::after{content:"?";font-size:10px;color:#9a5b14;margin-left:1px}
.lb:hover,.lb.on{background:#2a2420;color:#f4ecdc;transform:translateY(-11px) scale(1.06)}
.lb.big{font-size:14px;font-weight:900;letter-spacing:.06em}
.st{font-size:11.5px;color:#6a4f2a;letter-spacing:.2em;text-shadow:0 0 3px #f2e8d2,0 0 3px #f2e8d2;font-weight:600}
.hidden-labels .lb,.hidden-streets .st{display:none!important}
.lb.catoff{display:none}
.lb.minor{display:none;font-size:11px;font-weight:500}
body.walking .lb.minor:not(.catoff),.lb.minor.on:not(.catoff){display:flex}
.far .lb:not(.big):not(.gate):not(.on){display:none}

#tip{position:fixed;pointer-events:none;background:#2a2420;color:#f4ecdc;font-size:13px;padding:4px 9px;border-radius:3px;
  opacity:0;transition:opacity .12s}

/* original map modal */
#modal{position:fixed;inset:0;background:#1c1610;display:none;flex-direction:column;z-index:50}
#modal.show{display:flex}
#modal .stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#modal .stage.drag{cursor:grabbing}
#modal .pages{position:absolute;left:0;top:0;display:flex;transform-origin:0 0;will-change:transform}
#modal .pages img{width:1200px;height:2033px;display:block;pointer-events:none;-webkit-user-drag:none}
#modal .tools{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:6px;z-index:2}
#modal .tools button{width:40px;height:40px;border:1px solid rgba(239,230,210,.35);border-radius:4px;background:rgba(28,22,16,.78);color:#efe6d2;font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
#modal .tools button:hover{background:rgba(70,55,40,.9)}
#modal .zl{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap;color:#efe6d2;font-size:13px;background:rgba(28,22,16,.7);padding:5px 10px;border-radius:4px;z-index:2;pointer-events:none}
#modal .cap{background:var(--paper);color:var(--ink2);font-size:13px;line-height:1.7;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));max-height:30vh;overflow:auto}
#modal .cap.hide{display:none}

/* walk mode */
#walkUI{position:fixed;left:16px;bottom:16px;display:none;flex-direction:column;gap:8px;align-items:flex-start}
body.walking #walkUI{display:flex}
body.walking #side{display:none!important}
body.walking #title p{display:none}
#mini{background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:6px}
#mini canvas{display:block;width:240px;height:166px;cursor:crosshair}
#mini .cap{font-size:12.5px;color:var(--ink2);margin:5px 2px 0;display:flex;justify-content:space-between;gap:8px}
#mini .cap b{color:var(--ink)}
#dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
#dpad button{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:18px;cursor:pointer;
  box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
#dpad button:active{background:var(--ink);color:var(--paper)}
#cross{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  border:1.5px solid rgba(255,250,240,.85);box-shadow:0 0 2px rgba(0,0,0,.5);display:none;pointer-events:none}
body.walking #cross{display:block}
body.walking canvas{cursor:grab}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#e9dfc8;font-size:18px;letter-spacing:.3em;transition:opacity .6s}

@media (max-width:760px){
  #side{display:none}
  #side.mob{display:flex;top:auto;bottom:70px;height:46%;left:8px;right:8px;width:auto}
  #title{left:8px;top:8px;max-width:calc(100% - 80px);padding:8px 10px}
  #title h1{font-size:19px} #title p{display:none}
  #info{left:8px;right:8px;width:auto;top:auto;bottom:70px;max-height:50%}
  #compass{right:8px;top:8px} #compass.shift{right:8px}
  #bar{left:8px;right:8px;transform:none;overflow-x:auto;bottom:8px}
  #bar button{padding:7px 9px;font-size:13px}
  #hint{display:none}
  #btnList{display:inline-block!important}
  #walkUI{left:auto;right:calc(8px + env(safe-area-inset-right));bottom:auto;top:calc(70px + env(safe-area-inset-top))}
  #mini{padding:4px} #mini canvas{width:150px;height:104px} #mini .cap{font-size:11px} #mini .cap span:last-child{display:none}
  #bar{bottom:calc(8px + env(safe-area-inset-bottom));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right))}
  #bar::-webkit-scrollbar{display:none}
  #title{top:calc(8px + env(safe-area-inset-top))} #compass{top:calc(8px + env(safe-area-inset-top));width:46px;height:46px} #compass svg{width:46px;height:46px}
  #info{bottom:calc(66px + env(safe-area-inset-bottom));max-height:46%;padding:12px 14px 14px} #info h2{font-size:21px} #info blockquote{font-size:13.5px}
  body.walking #info{max-height:34%}
  #side.mob{bottom:calc(66px + env(safe-area-inset-bottom))}
  .lb{font-size:11px;padding:1px 5px} .lb.big{font-size:12.5px} .st{font-size:10.5px}
  #modal .cap{font-size:12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
}
@media (max-width:760px){ #streetSign{top:calc(62px + env(safe-area-inset-top));font-size:16px;padding:4px 12px 5px} }
/* 横屏手机（宽度可能超过 760）：小地图移到左上，摇杆留在左下，说明面板在右侧 */
@media (orientation:landscape) and (max-height:500px){
  #title,#hint{display:none}
  #walkUI{top:calc(8px + env(safe-area-inset-top));bottom:auto;right:auto;left:calc(8px + env(safe-area-inset-left))}
  #mini{padding:4px} #mini canvas{width:150px;height:104px} #mini .cap{font-size:11px} #mini .cap span:last-child{display:none}
  #joy{bottom:calc(58px + env(safe-area-inset-bottom));width:110px;height:110px}
  #info{left:auto;right:calc(8px + env(safe-area-inset-right));width:min(46%,420px);top:8px;bottom:auto;max-height:calc(100% - 66px);padding:12px 14px 14px}
  #info h2{font-size:21px}
  #bar{bottom:calc(6px + env(safe-area-inset-bottom))} #bar button{padding:6px 9px;font-size:13px}
  #streetSign{top:8px;left:calc(176px + env(safe-area-inset-left));transform:none!important;font-size:16px;padding:4px 12px 5px}
}
/* 竖屏漫步：说明面板移到顶部，让出左下角摇杆 */
@media (max-width:760px) and (orientation:portrait){
  body.walking #info{top:calc(8px + env(safe-area-inset-top));bottom:auto;max-height:40%;z-index:20}
}
@media (max-width:760px) and (orientation:landscape){
  #info{left:auto;right:8px;width:46%;top:8px;bottom:auto;max-height:calc(100% - 70px)}
  #joy{bottom:calc(64px + env(safe-area-inset-bottom))}
  #walkUI{top:8px;right:auto;left:calc(8px + env(safe-area-inset-left))}
  #title{display:none}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="title">
  <h1><span class="seal">康熙</span>南宫县城</h1>
  <p>依清康熙十二年（1673）《南宫县志》卷首〈县城图〉与卷二〈营建志〉复原。建筑位置取自原图，形制依志文所载，属示意复原。</p>
</div>

<aside id="side">
  <div class="hd">城中名胜 · 点选飞往
    <div id="cats"></div>
  </div>
  <div id="list"></div>
</aside>

<div id="compass"><svg viewBox="0 0 54 54"><g id="needle" transform="rotate(0 27 27)">
  <polygon points="27,15 30.5,27 27,25 23.5,27" fill="#a8322a"/><polygon points="27,45 30.5,27 27,29 23.5,27" fill="#8a7d6b"/>
  <text x="27" y="12.5" text-anchor="middle" font-size="9" font-weight="700" fill="#a8322a">北</text>
</g></svg></div>

<section id="info">
  <button class="x" aria-label="关闭">×</button>
  <h2 id="iName"></h2>
  <div class="tags" id="iTags"></div>
  <div id="iBody"></div>
</section>

<nav id="bar">
  <button id="btnList" style="display:none">名录</button>
  <button id="btnWalk">漫步</button>
  <button id="btnLabels" class="on">标注</button>
  <button id="btnStreets" class="on">街名</button>
  <button id="btnTime">暮色</button>
  <button id="btnSpin">环绕</button>
  <button id="btnTop">俯瞰</button>
  <button id="btnHQ" class="on">高画质</button>
  <button id="btnMap">原图</button>
  <button id="btnReset">复位</button>
</nav>
<div id="hint">左键拖动旋转 · 右键平移 · 滚轮缩放 · 点击建筑查看</div>
<div id="tip"></div>
<div id="cross"></div>
<div id="joy"><div id="knob"></div></div>
<div id="toast"></div>
<div id="streetSign"></div>
<div id="walkUI">
  <div id="mini"><canvas id="miniC" width="480" height="332"></canvas>
    <div class="cap"><span>附近：<b id="near">—</b></span><span>点图可瞬移</span></div></div>
  <div id="dpad">
    <span></span><button data-k="fwd" aria-label="前进">▲</button><span></span>
    <button data-k="tl" aria-label="左转">↶</button><button data-k="back" aria-label="后退">▼</button><button data-k="tr" aria-label="右转">↷</button>
  </div>
</div>

<div id="modal" role="dialog" aria-label="县城图原图">
  <div class="stage">
    <div class="pages">
      <img src="assets/xianchengtu-west.webp" alt="县城图·西半（左页）" draggable="false">
      <img src="assets/xianchengtu-east.webp" alt="县城图·东半（右页）" draggable="false">
    </div>
    <div class="zl">滚轮或双指缩放 · 拖动平移 · 双击放大</div>
    <div class="tools">
      <button data-z="in" aria-label="放大">＋</button><button data-z="out" aria-label="缩小">－</button><button data-z="fit" aria-label="适合窗口">⤢</button><button data-z="cap" aria-label="显示或隐藏说明">注</button><button class="x" aria-label="关闭">×</button>
    </div>
  </div>
  <p class="cap">康熙《南宫县志》〈县城图〉原为跨页：左页为城西半（宣化门、县治、城隍庙、兴福寺），右页为城东半（儒学、文庙、育英门、文昌阁、魁星楼），北门安阜门、南门来远门正在两页接缝处。原图上北下南、左西右东，为不按比例的示意图，3D 复原沿用其相对位置。</p>
</div>

<div id="loading">筑城中…</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ============ 基本 ============ */
const W=156, D=100, HX=W/2, HZ=D/2;      // 城内范围：x 西→东，z 北→南（-z 为北）
const WALL_T=2.4, WALL_H=2.6;
const C={tile:0x5b5f63,tileDark:0x45484b,glaze:0x3e6b57,red:0x983a2e,ochre:0xc49a55,white:0xd8d0be,stone:0xaaa396,
  brick:0x8f877a,dark:0x2b2320,earth:0xbcab84,street:0xd5c6a0,water:0x5b8590,grass:0x8e9b63,field:0xa3a86f,
  hay:0xc8a858,mud:0xa98d60,leaf:0x5d7346,trunk:0x5a4330,pave:0xcdc2a9,wood:0x8d6a45};

const CATS={
  gov:{n:'官署',c:'#a8322a'}, edu:{n:'学宫',c:'#2f6b5a'}, temple:{n:'坛庙祠',c:'#b4622a'},
  buddhist:{n:'寺庵',c:'#a07a1f'}, store:{n:'仓场',c:'#6b5a45'}, tower:{n:'楼阁坊',c:'#3f5590'}, arch:{n:'坊表',c:'#7a4f86'}, defense:{n:'城防',c:'#4b4b4b'}
};

const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;

/* 香炉：石座 + 三足鼎 + 双耳 + 线香（大者加炉顶亭盖），炉上青烟 */
function burner(g,x,z,s=1,canopy=false){
  const b=new THREE.Group(); b.position.set(x,0,z); b.scale.setScalar(s); g.add(b);
  box(b,.72,.16,.72,C.stone); box(b,.62,.05,.62,C.stone,0,.16,0);
  for(let k=0;k<3;k++){ const a=k*2.094+.5, l=new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,.3,6),bronze); l.position.set(Math.cos(a)*.17,.36,Math.sin(a)*.17); b.add(l); }
  const body=new THREE.Mesh(dingGeo,bronze); body.position.y=.42; b.add(body);
  for(const sg of [-1,1]){ const e=new THREE.Mesh(new THREE.TorusGeometry(.065,.016,6,14,Math.PI),bronze); e.position.set(sg*.21,.76,0); e.rotation.y=Math.PI/2; b.add(e); }
  const ash=new THREE.Mesh(new THREE.CircleGeometry(.25,16).rotateX(-Math.PI/2),M(0x8a8478)); ash.position.y=.73; b.add(ash);
  for(let k=0;k<7;k++){ const st=new THREE.Mesh(geoBox,M(0x9a3a22)); st.scale.set(.012,.2,.012); st.position.set(Math.cos(k*.9)*.1,.73,Math.sin(k*.9)*.1); st.rotation.z=(k%3-1)*.12; b.add(st); }
  if(canopy){
    for(const [a,c] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const p=new THREE.Mesh(new THREE.CylinderGeometry(.018,.022,.55,6),bronze); p.position.set(a*.2,1.08,c*.2); b.add(p); }
    roof(b,.78,.78,.36,'pyramid',C.tileDark,0,1.33,0);
  }
  b.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  smokeSources.push(b);
}
/* 石狮：须弥座 + 蹲姿狮身 + 鬃 + 绣球/幼狮 */
function lion(g,x,z,ry=0,s=1,male=true){
  const l=new THREE.Group(); l.position.set(x,0,z); l.rotation.y=ry; l.scale.setScalar(s); g.add(l);
  box(l,.42,.26,.62,0x8e887c); box(l,.48,.05,.68,0x8e887c,0,.26,0); box(l,.4,.05,.6,0x8e887c,0,.31,0);
  const sm=M(0xb3ac9f), sph=new THREE.IcosahedronGeometry(1,2), mane=new THREE.IcosahedronGeometry(1,1), cy=new THREE.CylinderGeometry(1,1,1,8);
  const P=(geo,x,y,z,sx,sy,sz,rx=0)=>{ const m=new THREE.Mesh(geo,sm); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.rotation.x=rx; m.castShadow=m.receiveShadow=true; l.add(m); };
  P(sph,0,.5,-.12,.16,.17,.2); P(sph,0,.64,.04,.15,.21,.14,-.25);
  P(mane,0,.9,.08,.18,.17,.16); P(sph,0,.9,.18,.12,.11,.1); P(sph,0,.86,.28,.065,.05,.05);
  for(const sg of [-1,1]){ P(sph,sg*.07,.97,.17,.03,.03,.03); P(cy,sg*.085,.47,.16,.045,.3,.045); P(sph,sg*.085,.34,.19,.055,.04,.075); P(sph,sg*.12,.4,-.2,.07,.08,.12); }
  P(sph,0,.55,-.33,.05,.1,.05,.6);
  if(male) P(new THREE.IcosahedronGeometry(1,1),.14,.39,.28,.07,.065,.07); else P(sph,.14,.37,.27,.06,.06,.08);
}
/* 石碑：龟趺或方座 + 碑身 + 圆首 */
function stele(g,x,z,ry=0,turtle=false,s=1){
  const t=new THREE.Group(); t.position.set(x,0,z); t.rotation.y=ry; t.scale.setScalar(s); g.add(t);
  const c=0x6d6862, sm=M(c);
  if(turtle){ const b=new THREE.Mesh(new THREE.IcosahedronGeometry(1,2),sm); b.scale.set(.34,.16,.5); b.position.y=.12; b.castShadow=true; t.add(b);
    const h=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),sm); h.scale.set(.09,.08,.14); h.position.set(0,.15,.52); t.add(h);
    for(const sg of [-1,1]) for(const zz of [-.3,.3]){ const f=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),sm); f.scale.set(.07,.05,.09); f.position.set(sg*.3,.05,zz); t.add(f); } }
  else box(t,.62,.18,.36,c);
  const y0=turtle?.24:.18; box(t,.5,.95,.12,c,0,y0,0);
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.13,18).rotateX(Math.PI/2),sm); top.scale.set(1,.72,1); top.position.y=y0+.95; top.castShadow=true; t.add(top);
}

function stall(g,x,z,ry,sd){
  const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const s=new THREE.Group(); s.position.set(x,0,z); s.rotation.y=ry; g.add(s);
  box(s,.95,.3,.42,C.wood);
  for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) cyl(s,.015,.015,.72,5,C.wood,a*.5,0,b*.24);
  const cv=[0xd8cfb4,0x3f5f80,0x8a5a3a,0xb9a77a,0x6a7a5a][Math.floor(r()*5)];
  const c=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.78).rotateX(-Math.PI/2+.42),clothMat(cv)); c.position.y=.72; c.castShadow=true; s.add(c);
  const goods=[0x6d8a3a,0xa33a26,0xd8cfa8,0xc49a3a,0x5a3a26,0x8a9a5a,0x4a6a8a];
  for(let k=0;k<5;k++){ const gx=-.36+k*.18, gc=goods[Math.floor(r()*goods.length)];
    if(r()<.5) cyl(s,.06,.05,.07,8,0xb49a62,gx,.3,0), box(s,.09,.04,.09,gc,gx,.36,0);
    else box(s,.13,.06+r()*.05,.14,gc,gx,.3,(r()-.5)*.1); }
}

function pave(g,w,d,c=C.pave){ const m=box(g,w,.05,d,c); m.castShadow=false; return m; }
function enclosure(g,w,d,{h=.8,c=C.red,cap=C.tile,gate=2,t=.26}={}){
  const seg=(w-gate)/2;
  const walls=[[seg,t,-(gate/2+seg/2),d/2],[seg,t,(gate/2+seg/2),d/2],[w,t,0,-d/2],[t,d,-w/2,0],[t,d,w/2,0]];
  for(const [a,b,x,z] of walls){ box(g,a,h,b,c,x,0,z); box(g,a+.12,.1,b+.22,cap,x,h,z); }
}
function pavilion(g,x,z,s=1.2,c=C.red,rc=C.tile){
  const p=new THREE.Group(); p.position.set(x,0,z); g.add(p);
  box(p,s+.5,.3,s+.5,C.stone);
  for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) cyl(p,.07,.07,s*.75,6,c,a*s/2.4,.3,b*s/2.4);
  roof(p,s+.55,s+.55,s*.6,'pyramid',rc,0,.3+s*.75,0);
}

  c.fillStyle='#c7c48f'; c.fillRect(0,0,miniBase.width,miniBase.height);
  const rect=(x0,z0,x1,z1,col)=>{const [a,b]=mp(x0,z0),[e,f]=mp(x1,z1); c.fillStyle=col; c.fillRect(a,b,e-a,f-b);};
  const o1=WALL_T/2+12.5, o0=WALL_T/2+7.5;
  rect(-HX-o1,-HZ-o1,HX+o1,HZ+o1,'#6f97a0'); rect(-HX-o0,-HZ-o0,HX+o0,HZ+o0,'#c7c48f');
  rect(-HX-WALL_T/2,-HZ-WALL_T/2,HX+WALL_T/2,HZ+WALL_T/2,'#7d7468');
  rect(-HX+WALL_T/2,-HZ+WALL_T/2,HX-WALL_T/2,HZ-WALL_T/2,'#d9cba6');
  for(const st of ST){ const h=Math.abs(st.a[1]-st.b[1])<.01, w=st.w/2;
    rect(Math.min(st.a[0],st.b[0])-(h?0:w),Math.min(st.a[1],st.b[1])-(h?w:0),Math.max(st.a[0],st.b[0])+(h?0:w),Math.max(st.a[1],st.b[1])+(h?w:0),'#f3ead3'); }
  for(const L of LM){ if(!L.type) continue; const col=CATS[L.cat].c;
    if(L.type==='gate'){ const [a,b]=mp(L.x,L.z); c.fillStyle=col; c.beginPath(); c.arc(a,b,6,0,7); c.fill(); continue; }
    rect(L.x-L.w/2,L.z-L.d/2,L.x+L.w/2,L.z+L.d/2,col); }
  c.fillStyle='#2a2420'; c.font='bold 18px "Noto Serif SC",serif'; c.textAlign='center';
  const [nx,ny]=mp(2.5,-HZ-17); c.fillText('北',nx,ny+6);
}
function drawMini(){
  mctx.drawImage(miniBase,0,0);
  const [px,py]=mp(player.x,player.z), fx=-Math.sin(yaw), fz=-Math.cos(yaw);
  mctx.save(); mctx.translate(px,py); mctx.rotate(Math.atan2(fx,-fz));
  mctx.fillStyle='rgba(168,50,42,.18)'; mctx.beginPath(); mctx.moveTo(0,0); mctx.arc(0,0,40,-Math.PI/2-.5,-Math.PI/2+.5); mctx.fill();
  mctx.fillStyle='#a8322a'; mctx.strokeStyle='#fff'; mctx.lineWidth=2.5;
  mctx.beginPath(); mctx.moveTo(0,-12); mctx.lineTo(8,8); mctx.lineTo(0,4); mctx.lineTo(-8,8); mctx.closePath(); mctx.stroke(); mctx.fill();
  mctx.restore();
  let best=null,bd=14;
  for(const L of LM){ if(!L.type) continue; const d=Math.max(Math.abs(player.x-L.x)-L.w/2,Math.abs(player.z-L.z)-L.d/2,0); if(d<bd){bd=d;best=L;} }
  nearEl.textContent=best?best.name:(Math.abs(player.x)>HX||Math.abs(player.z)>HZ?'城外':'街巷');
}
miniC.addEventListener('click',e=>{
  const r=miniC.getBoundingClientRect();
  player.x=MX0+(e.clientX-r.left)/r.width*(MX1-MX0); player.z=MZ0+(e.clientY-r.top)/r.height*(MZ1-MZ0);
});

applySky('day');

/* ============ 循环 ============ */
const needle=document.getElementById('needle');
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  updatePeople(dt); updateSmoke(now);
  if(walking){ updateWalk(dt); drawMini(); needle.setAttribute('transform',`rotate(${THREE.MathUtils.radToDeg(yaw)} 27 27)`);
    sky.position.copy(camera.position); composer.render(); lblR.render(scene,camera); requestAnimationFrame(loop); return; }
  if(fly){ const t=Math.min(1,(now-fly.s)/fly.dur), k=ease(t);
    camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(t>=1) fly=null; }
  controls.update();
  { const t=controls.target; t.y=THREE.MathUtils.clamp(t.y,0,12); t.x=THREE.MathUtils.clamp(t.x,-260,260); t.z=THREE.MathUtils.clamp(t.z,-260,260);
    if(camera.position.y<2.5) camera.position.y=2.5; }
  labelsEl.classList.toggle('far',camera.position.distanceTo(controls.target)>150);
  const az=controls.getAzimuthalAngle(); needle.setAttribute('transform',`rotate(${THREE.MathUtils.radToDeg(az)} 27 27)`);
  sky.position.copy(camera.position); composer.render(); lblR.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); lblR.setSize(innerWidth,innerHeight);});
const ld=$('loading'); ld.style.opacity=0; setTimeout(()=>ld.remove(),700);
</script>
